[project]
name = "mdacc-spatial"
version = "2.0.0"
description = "Multi-modal spatial biology analysis: COMET protein imaging, STOmics spatial transcriptomics, and MSI mass spectrometry imaging"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scanpy>=1.9",
    "anndata>=0.8",
    "matplotlib>=3.5",
    "seaborn>=0.11",
    "tifffile>=2021.8",
    "scikit-image>=0.19",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
registration = [
    "valis-wsi",
    "openslide-python",
]
batch-correction = [
    "harmonypy",
    "scvi-tools",
]
stomics = [
    "stereopy",
    "gefpy",
]
colab = [
    "gcsfs",
    "fsspec",
]
dev = [
    "nbstripout",
    "jupyter",
    "ipykernel",
    "pytest",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]
